name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-checks:
    name: Cargo checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.9.1

      - name: Check formatting
        run: cargo fmt --check

      - name: Check build
        run: cargo check --all-targets

      - name: Run tests
        run: cargo test --all-targets

      - name: Check compatibility report validation
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/compatibility -p test_matrix.py

      - name: Check native test process cleanup
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_native_cleanup.py

      - name: Check action wrapper
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_action.py

      - name: Check workflows
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  fixture-end-to-end:
    name: Fixture end-to-end smoke test
    runs-on: ubuntu-latest
    needs: cargo-checks
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install host Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils

      - name: Add Flathub
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Build verifier container
        run: docker build -t flatpak-smoke -f Containerfile .

      - name: Build local fixture bundle
        run: |
          flatpak-builder --force-clean --user --install-deps-from=flathub --repo=target/fixture-repo target/fixture-build fixtures/minimal-wayland/org.example.FlatpakSmokeFixture.yml
          flatpak build-bundle target/fixture-repo target/org.example.FlatpakSmokeFixture.flatpak org.example.FlatpakSmokeFixture

      - name: Verify local fixture bundle
        uses: ./
        with:
          bundle: target/org.example.FlatpakSmokeFixture.flatpak
          image: flatpak-smoke
          output: target/fixture-smoke-output
          allow-network-remotes: 'true'
          args: --force --screenshot-after-click "Click Me" --overall-timeout 5m

      - name: Verify local fixture repository as non-root
        uses: ./
        with:
          repo: target/fixture-repo
          app-ref: app/org.example.FlatpakSmokeFixture/x86_64/master
          image: flatpak-smoke
          output: target/fixture-repo-action
          allow-network-remotes: 'true'
          user: nobody
          args: --overall-timeout 5m

      - name: Exercise action failure reporting
        id: expected-failure
        continue-on-error: true
        uses: ./
        with:
          bundle: target/org.example.FlatpakSmokeFixture.flatpak
          image: flatpak-smoke
          output: target/fixture-action-failure
          allow-network-remotes: 'true'
          args: --window-timeout 1ms --overall-timeout 5m

      - name: Assert action failure preserves artifacts
        env:
          OUTCOME: ${{ steps.expected-failure.outcome }}
          OUTPUT: ${{ steps.expected-failure.outputs.output }}
        run: |
          test "$OUTCOME" = failure
          test "$OUTPUT" = target/fixture-action-failure
          test -r "$OUTPUT/result.json"
          python3 -c 'import json, sys; assert json.load(open(sys.argv[1]))["status"] == "failed"' "$OUTPUT/result.json"

      - name: Assert smoke artifacts exist
        run: |
          set -eu
          for output in target/fixture-smoke-output; do
            test -s "$output/result.json"
            test -d "$output/logs"
            test -s "$output/logs/runner.log"
            test -d "$output/screenshots"
            test -s "$output/screenshots/000-window-visible.png"
            test -s "$output/screenshots/001-after-click-click-me.png"
            python3 -c 'import json, sys; result = json.load(open(sys.argv[1])); assert result["status"] == "passed", result; assert result["screenshots"], result' "$output/result.json"
          done
          python3 -c 'import json; result = json.load(open("target/fixture-smoke-output/result.json")); assert "screenshots/001-after-click-click-me.png" in result["screenshots"], result'

      - name: Upload smoke outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-outputs
          if-no-files-found: error
          path: |
            target/fixture-smoke-output/result.json
            target/fixture-smoke-output/logs/**
            target/fixture-smoke-output/screenshots/**
            target/fixture-repo-action/**
            target/fixture-action-failure/**

      - name: Verify readiness and exit fixture modes
        run: python3 tests/fixture_modes.py

      - name: Upload fixture mode outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fixture-mode-outputs
          if-no-files-found: warn
          path: target/fixture-modes/**

  screenshot-end-to-end:
    name: Native screenshot recipes
    runs-on: ubuntu-latest
    needs: cargo-checks
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install fixture build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Build screenshot test image
        run: docker build --target e2e-tests -t screenshot-tests -f Containerfile.screenshots .

      - name: Check production screenshot image
        run: |
          docker build -t screenshot-production -f Containerfile.screenshots .
          docker run --rm --privileged --tmpfs /run screenshot-production

      - name: Build GTK and Qt fixture bundles
        run: |
          for toolkit in Gtk Qt; do
            flatpak-builder --force-clean --user --install-deps-from=flathub --repo="target/screenshot-$toolkit-repo" "target/screenshot-$toolkit-build" "fixtures/screenshot/org.example.Screenshot$toolkit.yml"
            flatpak build-bundle "target/screenshot-$toolkit-repo" "target/org.example.Screenshot$toolkit.flatpak" "org.example.Screenshot$toolkit"
          done

      - name: Check native window images and input
        run: |
          docker run --rm --privileged --tmpfs /run screenshot-tests flatpak-smoke doctor --desktop gnome
          docker run --rm --privileged --tmpfs /run -v "$PWD:/workspace" -w /workspace screenshot-tests python3 tests/native_capture.py

      - name: Execute GTK and Qt recipes
        run: |
          for toolkit in Gtk Qt; do
            docker run --rm --privileged --tmpfs /run -v "$PWD:/workspace" -w /workspace screenshot-tests \
              python3 tests/screenshot_workflow.py --binary /usr/local/bin/flatpak-smoke \
              --bundle "target/org.example.Screenshot$toolkit.flatpak" --output "target/screenshot-workflow-$toolkit"
          done
          docker run --rm --privileged --tmpfs /run -v "$PWD:/workspace" -w /workspace screenshot-tests \
            python3 tests/screenshot_workflow.py --binary /usr/local/bin/flatpak-smoke \
              --repo target/screenshot-Gtk-repo --output target/screenshot-workflow-repo

      - name: Check seeded data and launch arguments in fresh profiles
        run: |
          docker run --rm --privileged --tmpfs /run --tmpfs /dev/dri \
            -v "$PWD:/workspace" -w /workspace screenshot-tests python3 tests/screenshot_setup.py

      - name: Capture seeded bundle through the action
        uses: ./
        with:
          mode: screenshots
          bundle: target/org.example.ScreenshotGtk.flatpak
          recipe: fixtures/screenshot/seeded.yml
          output: target/screenshot-action-bundle
          image: screenshot-production
          allow-network-remotes: 'true'

      - name: Capture seeded repository through the action as non-root
        uses: ./
        with:
          mode: screenshots
          repo: target/screenshot-Gtk-repo
          app-ref: app/org.example.ScreenshotGtk/x86_64/master
          recipe: fixtures/screenshot/seeded.yml
          output: target/screenshot-action-repo
          image: screenshot-tests
          user: nobody
          allow-network-remotes: 'true'

      - name: Replace non-root action output
        uses: ./
        with:
          mode: screenshots
          repo: target/screenshot-Gtk-repo
          app-ref: app/org.example.ScreenshotGtk/x86_64/master
          recipe: fixtures/screenshot/seeded.yml
          output: target/screenshot-action-repo
          image: screenshot-tests
          user: nobody
          allow-network-remotes: 'true'
          args: --force

      - name: Check recipe failures and fresh profiles
        run: |
          docker run --rm --privileged --tmpfs /run -v "$PWD:/workspace" -w /workspace screenshot-tests \
            python3 tests/screenshot_failures.py --binary /usr/local/bin/flatpak-smoke

      - name: Upload screenshot evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-screenshots
          if-no-files-found: warn
          path: |
            target/native-capture/**
            target/screenshot-workflow-*/**
            target/screenshot-failures/**
            target/screenshot-setup-*/**
            target/screenshot-action-*/**

  publish:
    name: Publish ${{ matrix.image }}
    needs: [cargo-checks, fixture-end-to-end, screenshot-end-to-end]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: flatpak-smoke
            file: Containerfile
          - image: flatpak-smoke-screenshots
            file: Containerfile.screenshots
    steps:
      - uses: actions/checkout@v7
      - name: Check release image version matches the action
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -c 'import os, pathlib; assert pathlib.Path("action/image-version").read_text().strip() == os.environ["RELEASE_TAG"], "Update action/image-version before tagging a release"'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  screenshot-compatibility:
    name: Real-app screenshot compatibility
    runs-on: ubuntu-latest
    needs: cargo-checks
    timeout-minutes: 45
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - name: Build capture environment and resolve real apps
        run: |
          docker build -t flatpak-smoke-screenshots -f Containerfile.screenshots .
          docker build -t screenshot-compatibility -f Containerfile.compatibility .

      - name: Run serial and concurrent recipes
        run: |
          image_id=$(docker image inspect screenshot-compatibility --format '{{.Id}}')
          mkdir -p target
          docker run --rm --privileged --tmpfs /run --tmpfs /dev/dri \
            -v "$PWD:/workspace" -w /workspace "$image_id" sh -c '
              install -d -o 65534 -g 65534 target/compatibility
              exec setpriv --reuid=65534 --regid=65534 --clear-groups \
                python3 tests/compatibility/matrix.py \
                --output target/compatibility/run --image-id "$1"
            ' compatibility "$image_id"

      - name: Check detached-app cancellation cleanup
        run: |
          docker run --rm --privileged --tmpfs /run --tmpfs /dev/dri \
            -v "$PWD:/workspace" -w /workspace screenshot-compatibility \
            setpriv --reuid=65534 --regid=65534 --clear-groups \
            python3 tests/screenshot_failures.py --binary /usr/local/bin/flatpak-smoke \
            --bundle /opt/compatibility/artifacts/com.vscodium.codium.flatpak \
            --output target/compatibility/cancellation --case cancel-instances --expect-detached

      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-compatibility
          if-no-files-found: warn
          path: target/compatibility/**

  flathub-end-to-end:
    name: Flathub end-to-end smoke tests
    runs-on: ubuntu-latest
    needs: cargo-checks
    timeout-minutes: 60
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install host Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak

      - name: Add Flathub
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Build verifier container
        run: docker build -t flatpak-smoke -f Containerfile .

      - name: Bundle Flathub apps for verification
        run: |
          mkdir -p target
          flatpak install --user --noninteractive flathub org.gnome.Calculator org.gnome.Fractal
          flatpak build-bundle "$HOME/.local/share/flatpak/repo" target/org.gnome.Calculator.flatpak org.gnome.Calculator stable
          flatpak build-bundle "$HOME/.local/share/flatpak/repo" target/org.gnome.Fractal.flatpak org.gnome.Fractal stable

      - name: Verify Flathub app bundle
        run: |
          docker run --rm --privileged \
            -v "$PWD:/workspace" \
            -w /workspace \
            flatpak-smoke \
            verify-bundle target/org.gnome.Calculator.flatpak \
            --output target/calculator-smoke-output \
            --force \
            --allow-network-remotes \
            --overall-timeout 5m

      - name: Verify Flathub Wayland app bundle
        run: |
          docker run --rm --privileged \
            -v "$PWD:/workspace" \
            -w /workspace \
            flatpak-smoke \
            verify-bundle target/org.gnome.Fractal.flatpak \
            --output target/fractal-smoke-output \
            --force \
            --allow-network-remotes \
            --screenshot-after-click "Log In" \
            --overall-timeout 5m

      - name: Assert Flathub smoke artifacts exist
        run: |
          set -eu
          for output in target/calculator-smoke-output target/fractal-smoke-output; do
            test -s "$output/result.json"
            test -d "$output/logs"
            test -s "$output/logs/runner.log"
            test -d "$output/screenshots"
            test -s "$output/screenshots/000-window-visible.png"
            python3 -c 'import json, sys; result = json.load(open(sys.argv[1])); assert result["status"] == "passed", result; assert result["screenshots"], result' "$output/result.json"
          done
          test -s target/fractal-smoke-output/screenshots/001-after-click-log-in.png
          python3 -c 'import json; result = json.load(open("target/fractal-smoke-output/result.json")); assert len(result["screenshots"]) >= 2, result; assert "screenshots/001-after-click-log-in.png" in result["screenshots"], result'

      - name: Upload Flathub smoke outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flathub-smoke-test-outputs
          if-no-files-found: error
          path: |
            target/calculator-smoke-output/result.json
            target/calculator-smoke-output/logs/**
            target/calculator-smoke-output/screenshots/**
            target/fractal-smoke-output/result.json
            target/fractal-smoke-output/logs/**
            target/fractal-smoke-output/screenshots/**
